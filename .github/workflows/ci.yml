name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# 同一 ref 的运行排队执行，避免连续 push main 时两次运行互相打断
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # 与本地开发推荐版本一致
          cache: pip
      - name: Install deps
        # 只装 pip 包，不装 playwright 浏览器：测试是离线特征测试，不启浏览器
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Stub frontend dist
        # backend.main 只在 frontend/dist 存在时才注册 SPA 路由（/、/favicon.svg、
        # /{full_path}）。路由契约测试要断言完整路由表，所以造个空壳让它们注册；
        # 内容无所谓，契约测试只枚举路由不请求它们。
        run: mkdir -p frontend/dist/assets && touch frontend/dist/index.html
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test --if-present
      - run: npm run build

  # 打 v* 标签时，测试和前端构建都过了才创建同名 GitHub Release。
  # 用途是发布版本说明（源码分发，不发布任何镜像）。
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # 重跑时保留已发布的说明，包括维护者在网页上编辑的内容。
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          notes_file="docs/releases/$RELEASE_TAG.md"
          args=(--verify-tag --title "$RELEASE_TAG")
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          if [[ -f "$notes_file" ]]; then
            args+=(--notes-file "$notes_file")
          else
            # 没有手写说明时，给一份源码安装方式 + GitHub 自动生成的变更记录
            {
              echo '## 安装（源码构建）'
              echo
              echo '本项目通过源码运行，不提供预构建镜像。'
              echo
              echo '```bash'
              echo "git clone ${GITHUB_SERVER_URL}/${GH_REPO}.git"
              echo "cd $(basename "$GH_REPO")"
              echo 'python3 -m venv venv && source venv/bin/activate   # Windows: venv\Scripts\activate'
              echo 'pip install -r requirements.txt && playwright install chromium'
              echo 'cd frontend && npm install && npm run build && cd ..'
              echo 'python3 -m uvicorn backend.main:app --host 127.0.0.1 --port 8000'
              echo '```'
            } > "$RUNNER_TEMP/release-notes.md"
            args+=(--notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
